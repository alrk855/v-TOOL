services:
  dashboard-service:
    build:
      context: .
      dockerfile: services/dashboard/Dockerfile
    container_name: dplt-dashboard
    environment:
      DASHBOARD_PORT: 3000
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/telemetry.sqlite}
      PROXY_ROUTES_JSON: ${PROXY_ROUTES_JSON:-}
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:-}
      TZ: ${TZ:-Europe/Skopje}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      - dashboard-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  runner-engine-service:
    build:
      context: .
      dockerfile: services/runner-engine/Dockerfile
    container_name: dplt-runner-engine
    environment:
      DASHBOARD_API_BASE: ${RUNNER_DASHBOARD_API_BASE:-http://dashboard-service:3000}
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:-}
      RUNNER_CONCURRENCY: ${RUNNER_CONCURRENCY:-4}
      RUNNER_POLL_INTERVAL_MS: ${RUNNER_POLL_INTERVAL_MS:-2500}
      DIAGNOSTIC_ENDPOINT: ${DIAGNOSTIC_ENDPOINT:-https://api.ipify.org?format=json}
      PROXY_ROUTES_JSON: ${PROXY_ROUTES_JSON:-}
      DEV_MODE: ${DEV_MODE:-}
      HEADLESS: ${HEADLESS:-}
      CHROME_CDP_ENDPOINT: ${CHROME_CDP_ENDPOINT:-}
      SCREENSHOTS_ENABLED: ${SCREENSHOTS_ENABLED:-false}
      TZ: ${TZ:-Europe/Skopje}
      SURVEY_OPTION_TEXT: ${SURVEY_OPTION_TEXT:-}
      SURVEY_OPTION_SELECTOR: ${SURVEY_OPTION_SELECTOR:-}
      CONFIRMATION_TEXTS: ${CONFIRMATION_TEXTS:-Vote,Submit,Гласај}
      CONFIRMATION_SELECTOR: ${CONFIRMATION_SELECTOR:-}
    depends_on:
      dashboard-service:
        condition: service_healthy
    shm_size: "1gb"

volumes:
  dashboard-data:
